# LuxStage — Betreiber-Panel als eigenständiges Compose-Projekt.
# Reine statische Frontend-Auslieferung (kein DB-Zugriff, keine Abhängigkeit
# auf luxstage-saas im Code) — hängt nur übers Docker-Netzwerk am SaaS-Stack,
# damit Caddy sowohl den SaaS-Server (/api/operator/*) als auch dieses
# Panel-Frontend (HTML/JS) unter admin.luxstage.app erreichen kann. Das Netz
# wird vom luxstage-saas-Projekt angelegt — hier nur mitbenutzt (external).
services:
  luxstage-operator-panel:
    image: ghcr.io/plobli/luxstage-operator-panel:latest
    container_name: luxstage-operator-panel
    restart: unless-stopped
    networks:
      - luxstage-saas-net
    environment:
      PORT: 3001
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/health', r =>
          process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () =>
          process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  luxstage-saas-net:
    name: luxstage-saas-net
    external: true
