services:
  luxstage:
    build:
      context: .
      dockerfile: Dockerfile.saas
    container_name: luxstage-saas
    restart: unless-stopped
    expose:
      - 3000
    volumes:
      - luxstage-saas-data:/app/data
    networks:
      - caddy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Pflicht: mindestens 32 zufällige Zeichen, z. B.: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET}
      DATA_PATH: /app/data
      # Öffentliche URL der App — für Bestätigungslinks in Registrierungs-Mails
      APP_URL: ${APP_URL}
      # Kommasepariert, i. d. R. die eigene Domain
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # SMTP: Pflicht für Registrierung (Doppel-Opt-In)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-LuxStage <noreply@luxstage.app>}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/health', r =>
          process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () =>
          process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  luxstage-operator-panel:
    build:
      context: .
      dockerfile: operator-panel/Dockerfile
    container_name: luxstage-operator-panel
    restart: unless-stopped
    expose:
      - 3001
    networks:
      - caddy
    environment:
      PORT: 3001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/health', r =>
          process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () =>
          process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  luxstage-saas-data:

networks:
  caddy:
    external: true
