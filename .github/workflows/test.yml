name: Tests

# Führt die Backend- und Frontend-Testsuite bei jedem Push/PR gegen main aus.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Dependency-Schwachstellenprüfung
        run: npm audit --audit-level=high

      - name: Docker-Compose-Konfiguration prüfen
        run: |
          JWT_SECRET=test-secret CORS_ORIGINS=http://localhost \
            docker compose -f docker-compose.yml config --quiet
          JWT_SECRET=test-secret APP_URL=https://example.test \
            SMTP_HOST=localhost SMTP_USER=test SMTP_PASS=test \
            docker compose -f docker-compose.saas.yml config --quiet
          docker compose -f docker-compose.operator-panel.yml config --quiet

      - name: Server-Tests
        run: npm run test:ci -w server

      - name: Web-App-Tests
        run: npm test -w web-app

      - name: Web-App-Typprüfung
        run: npm run typecheck -w web-app
