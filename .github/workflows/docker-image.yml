name: Self-Hosted-Image bauen

# Baut das Self-Hosted-Docker-Image bei Version-Tag und pusht es nach GHCR.
# Privat (Repo-Sichtbarkeit). Server zieht das Image via docker compose pull.
on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/plobli/luxstage-server

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nötig zum Push nach GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags/Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
