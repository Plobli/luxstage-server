name: Betreiber-Panel-Image bauen

# Baut das Betreiber-Panel-Image bei jedem main-Push mit Änderungen unter
# operator-panel/ und pusht es nach GHCR. Eigenständig vom SaaS-Image (das
# weiterhin am Version-Tag hängt, siehe saas-image.yml) — eine reine
# Panel-Änderung braucht keinen Version-Tag/Release des ganzen Monorepos,
# ein Server-Tag baut umgekehrt nicht unnötig das Panel neu.
on:
  push:
    branches: [main]
    paths:
      - 'operator-panel/**'

env:
  IMAGE: ghcr.io/plobli/luxstage-operator-panel

jobs:
  quality:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nötig zum Push nach GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags/Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Kein Version-Tag als Quelle (Panel hat keine eigene Versionsnummer) —
          # latest zum Deployen, Short-SHA als eindeutige, nachvollziehbare Referenz.
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./operator-panel/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
