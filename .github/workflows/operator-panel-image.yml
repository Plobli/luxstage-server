name: Betreiber-Panel-Image bauen

# Baut das Betreiber-Panel-Image bei jedem Version-Tag und pusht es nach GHCR.
# Läuft am selben Tag-Trigger wie das SaaS-Image, aber als eigenständiges,
# unabhängig deploybares Image — eine Panel-Änderung erfordert kein
# Redeploy von luxstage-saas.
on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/plobli/luxstage-operator-panel

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nötig zum Push nach GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags/Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./operator-panel/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
