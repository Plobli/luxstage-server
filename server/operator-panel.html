<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LuxStage · Betreiber</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --border:#2a2e38; --fg:#e6e8ec; --mut:#9aa0ac; --acc:#c9a86a; --danger:#e5484d; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:960px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--mut); margin:0 0 24px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
  label { display:block; font-size:13px; color:var(--mut); margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--fg); font-size:15px; }
  button { padding:9px 16px; border:none; border-radius:8px; background:var(--acc); color:#1a1d24; font-weight:600; cursor:pointer; font-size:14px; }
  button:hover { opacity:.9; }
  button.ghost { background:transparent; border:1px solid var(--border); color:var(--fg); }
  button.danger { background:var(--danger); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:14px; }
  th { color:var(--mut); font-weight:500; }
  .tag { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; }
  .tag.ok { background:#1e3a2a; color:#6cd18e; }
  .tag.sus { background:#3a1e1e; color:#e88; }
  .err { color:var(--danger); font-size:14px; margin-top:12px; }
  .row-actions { display:flex; gap:8px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .mut { color:var(--mut); font-size:13px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Login -->
  <div id="loginView">
    <h1>LuxStage · Betreiber</h1>
    <p class="sub">Verwaltung aller Mandanten</p>
    <div class="card" style="max-width:400px">
      <form id="loginForm">
        <label for="u">Benutzername</label>
        <input id="u" autocomplete="username" required>
        <label for="p">Passwort</label>
        <input id="p" type="password" autocomplete="current-password" required>
        <div style="margin-top:20px"><button type="submit">Anmelden</button></div>
        <div id="loginErr" class="err hidden"></div>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashView" class="hidden">
    <div class="topbar">
      <div>
        <h1>Mandanten</h1>
        <p class="sub" id="count"></p>
      </div>
      <div style="display:flex; align-items:center; gap:12px">
        <span class="mut" id="version"></span>
        <button class="ghost" id="logoutBtn">Abmelden</button>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Team</th><th>E-Mail</th><th>Registriert</th><th>Shows</th><th>Nutzer</th><th>Status</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="mut hidden" style="padding:16px 12px">Noch keine Mandanten.</div>
    </div>

    <h1 style="font-size:16px; margin:28px 0 2px">Offene Registrierungen</h1>
    <p class="sub" id="pendingCount"></p>
    <div class="card">
      <table>
        <thead><tr><th>Team</th><th>E-Mail</th><th>Angefragt</th><th>Läuft ab</th><th></th></tr></thead>
        <tbody id="pendingBody"></tbody>
      </table>
      <div id="pendingEmpty" class="mut hidden" style="padding:16px 12px">Keine offenen Registrierungen.</div>
    </div>
  </div>

  <!-- Backup-Dialog -->
  <div id="backupOverlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:20px;z-index:50">
    <div class="card" style="max-width:560px;width:100%">
      <div class="topbar" style="margin-bottom:12px">
        <h1 style="font-size:16px">Backups · <span id="bkTenant"></span></h1>
        <button class="ghost" id="bkClose">Schließen</button>
      </div>
      <div style="margin-bottom:12px"><button id="bkCreate">Jetzt sichern</button></div>
      <table>
        <thead><tr><th>Zeitpunkt</th><th>Größe</th><th></th></tr></thead>
        <tbody id="bkBody"></tbody>
      </table>
      <div id="bkEmpty" class="mut hidden" style="padding:12px">Noch keine Snapshots.</div>
    </div>
  </div>

</div>

<script src="/operator-panel.js"></script>
</body>
</html>
